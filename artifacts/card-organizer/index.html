<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Oh My Cards keeps your credit cards, rewards and due dates organised on your device — no account, no server." />
    <meta name="theme-color" content="#F7F4EE" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121921" media="(prefers-color-scheme: dark)" />
    <title>Oh My Cards</title>
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="%BASE_URL%favicon-32.png?v=rounded-3" />
    <link rel="apple-touch-icon" sizes="180x180" href="%BASE_URL%favicon-180.png?v=rounded-3" />
    <script>
      // Stamp the theme before first paint so the app never flashes light on a dark device.
      // Must stay in sync with the next-themes storage key and class attribute in src/main.tsx.
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          var theme =
            stored === "light" || stored === "dark"
              ? stored
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.classList.add(theme);
          document.documentElement.style.colorScheme = theme;
        } catch (error) {
          document.documentElement.classList.add("light");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
