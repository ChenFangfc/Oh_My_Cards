name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
    # The freshness bot commits reports here daily; they change nothing the
    # site serves, so they must not trigger a redeploy.
    paths-ignore:
      - "card-data/**"
  workflow_dispatch:

# Third-party code runs in the build job (npm packages), so only the deploy
# job may publish to Pages or mint an OIDC token.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Nothing here pushes; don't leave the token where build code can read it.
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        env:
          npm_config_user_agent: pnpm/ci
        run: COREPACK_ENABLE_AUTO_PIN=0 corepack pnpm install --frozen-lockfile

      - name: Build workspace client types
        run: COREPACK_ENABLE_AUTO_PIN=0 corepack pnpm exec tsc -p lib/api-client-react/tsconfig.json

      - name: Typecheck
        run: |
          COREPACK_ENABLE_AUTO_PIN=0 corepack pnpm --dir lib/api-client-react typecheck
          COREPACK_ENABLE_AUTO_PIN=0 corepack pnpm --dir artifacts/card-organizer typecheck
          COREPACK_ENABLE_AUTO_PIN=0 corepack pnpm --dir scripts typecheck

      # The reward engine decides every number the app shows, and a category
      # matcher regression is invisible until someone checks their statement.
      - name: Test reward engine
        run: COREPACK_ENABLE_AUTO_PIN=0 corepack pnpm --dir lib/api-client-react test

      # Emits public/card-rules/{manifest.json,<version>.json} so already-installed
      # PWAs can pull new card rules without waiting for an app update.
      # Installed apps replace their whole rulebook with the published feed.
      - name: Lint card catalog
        run: COREPACK_ENABLE_AUTO_PIN=0 corepack pnpm --dir scripts cards:lint

      - name: Publish card rules feed
        run: COREPACK_ENABLE_AUTO_PIN=0 corepack pnpm --dir scripts cards:publish

      - name: Build
        env:
          VITE_CARD_RULES_MANIFEST_URL: /Oh_My_Cards/card-rules/manifest.json
          # Content Security Policy as a meta tag (Pages can't send headers).
          WEB_CSP: "1"
        run: COREPACK_ENABLE_AUTO_PIN=0 PORT=19957 BASE_PATH=/Oh_My_Cards/ corepack pnpm --dir artifacts/card-organizer build

      # GitHub Pages has no rewrite rules, so a deep link or hard refresh on a
      # client-routed path (/wallet, /cards, ...) must be served the app shell
      # through the 404 handler instead of GitHub's own error page.
      - name: Add SPA fallback
        run: cp artifacts/card-organizer/dist/public/index.html artifacts/card-organizer/dist/public/404.html

      # The film, playable in a browser from the README ("Watch with sound").
      # Copied here rather than into public/, so the desktop app doesn't ship it.
      - name: Add the film
        run: |
          mkdir -p artifacts/card-organizer/dist/public/video
          cp docs/promo/*.mp4 artifacts/card-organizer/dist/public/video/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: artifacts/card-organizer/dist/public

  deploy:
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
